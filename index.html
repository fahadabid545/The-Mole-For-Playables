<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Jungle Mole</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #8fd4e8; overflow: hidden; touch-action: none; overscroll-behavior: none; }
      #app { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
      canvas { display: block; }
      /* Hide the OS cursor only while a level is actually being played;
         the Game scene toggles the `.playing` class on <body>.
         On menus / popups the OS cursor stays visible so buttons are
         obviously clickable. */
      body.playing, body.playing canvas, body.playing #app { cursor: none; }
      * { -webkit-tap-highlight-color: transparent; user-select: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
